# pnpm workspace for the react-native-watchos project (NOT the whole repo —
# the other projects/ are unrelated). Members:
#   js            the renderer (the published package `react-native-watchos`)
#   examples/*    consumer apps that depend on it via `workspace:*`
#   app           the reference Expo iPhone app + watch target (native host)
#
# The workspace is what makes `import "react-native-watchos"` resolve with a
# single React instance for every consumer — no esbuild alias / nodePaths /
# tsconfig-paths glue.
packages:
  - js
  - examples/*
  - app
