# pnpm workspace for the react-watchos project (NOT the whole repo —
# the other projects/ are unrelated). Members:
#   js            the renderer package (`react-watchos`)
#   examples/*    consumer apps that depend on it via `workspace:*`
#   app           the reference Expo iPhone app + watch target (native host)
#
# The workspace is what makes `import "react-watchos"` resolve with a
# single React instance for every consumer — no esbuild alias / nodePaths /
# tsconfig-paths glue.
packages:
  - js
  - examples/*
  - app

# Supply-chain cooldown: refuse to install any dependency version published less
# than 7 days ago (10080 minutes), so a freshly-compromised release has a window
# to be caught/yanked before it can land in our lockfile. Opt-in on pnpm 10.x
# (default 0 = off; pnpm 11 defaults it to 1 day). Add names/globs to
# `minimumReleaseAgeExclude` to exempt a package if a real update is ever blocked.
minimumReleaseAge: 10080
