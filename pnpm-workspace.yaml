# pnpm workspace for this repo. Members:
#   js            the renderer package (`react-watchos`)
#   examples/*    consumer apps that depend on it via `workspace:*`
#   app           the reference Expo iPhone app + watch target (native host)
#
# The workspace is what makes `import "react-watchos"` resolve without esbuild
# alias / nodePaths / tsconfig-paths glue. It does NOT by itself give every
# consumer a single React: that needs each member's `react` range to overlap
# js/'s (an exact pin here next to a caret floor there resolves to two copies,
# and both land in the member's watch bundle). The build preset's single-copy
# check is what proves it — see js/esbuild/single-copy.mts.
packages:
  - js
  - examples/*
  - app

# Supply-chain cooldown: refuse to install any dependency version published less
# than 7 days ago (10080 minutes), so a freshly-compromised release has a window
# to be caught/yanked before it can land in our lockfile. pnpm 11 defaults this
# to 1 day; we keep the stricter 7. Add names/globs to
# `minimumReleaseAgeExclude` to exempt a package if a real update is ever blocked.
minimumReleaseAge: 10080
# Fail-loud companion: when NO version satisfies the age constraint (a
# brand-new package, or an exact pin on a fresh release), fail resolution
# instead of silently falling back to a younger version. pnpm 11 already
# defaults this to true when minimumReleaseAge is set explicitly — pinned
# here so the behavior survives a default change and the intent is visible.
# Escape hatch stays `minimumReleaseAgeExclude` (names, @scope/* globs, or
# exact `pkg@version` entries).
minimumReleaseAgeStrict: true

# Transitive-CVE remediation. `@bacons/xcode` (both published alphas) pins
# `@expo/plist@^0.0.18`, which pins `@xmldom/xmldom@~0.7.0` — and 0.7.x is
# affected by GHSA-wh4c-j3r5-mjhp (HIGH, CDATA terminator injection on
# serialize) with NO 0.7 patch: the fix starts at 0.8.12. Newer @expo/plist
# releases already sit on ^0.8.8, so 0.8.x is the version @expo/plist's own
# code is written against; this override just drags the pinned-back copy
# forward. It is build-time only — plist editing during `expo prebuild`,
# never bundled into a watch app — but a HIGH with a one-line remedy is not
# worth carrying. Verified by a full `expo prebuild` after the override.
# Consumers need the same line in their own workspace (they install
# @bacons/apple-targets themselves — it is our peer, not our dependency);
# SECURITY.md carries the copy-paste.
overrides:
  '@xmldom/xmldom@~0.7.0': ^0.8.12

# Lifecycle-script allowlist (pnpm 11 home of package.json's former
# pnpm.onlyBuiltDependencies): only the toolchain binaries we actually
# execute during build/test; everything else stays sandboxed.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
