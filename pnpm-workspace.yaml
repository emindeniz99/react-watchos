# pnpm workspace for this repo. Members:
#   js            the renderer package (`react-watchos`)
#   examples/*    consumer apps that depend on it via `workspace:*`
#   app           the reference Expo iPhone app + watch target (native host)
#
# The workspace is what makes `import "react-watchos"` resolve without esbuild
# alias / nodePaths / tsconfig-paths glue. It does NOT by itself give every
# consumer a single React: that needs each member's `react` range to overlap
# js/'s (an exact pin here next to a caret floor there resolves to two copies,
# and both land in the member's watch bundle). The build preset's single-copy
# check is what proves it — see js/esbuild/single-copy.mts.
packages:
  - js
  - examples/*
  - app

# Supply-chain cooldown: refuse to install any dependency version published less
# than 7 days ago (10080 minutes), so a freshly-compromised release has a window
# to be caught/yanked before it can land in our lockfile. pnpm 11 defaults this
# to 1 day; we keep the stricter 7. Add names/globs to
# `minimumReleaseAgeExclude` to exempt a package if a real update is ever blocked.
minimumReleaseAge: 10080
# Fail-loud companion: when NO version satisfies the age constraint (a
# brand-new package, or an exact pin on a fresh release), fail resolution
# instead of silently falling back to a younger version. pnpm 11 already
# defaults this to true when minimumReleaseAge is set explicitly — pinned
# here so the behavior survives a default change and the intent is visible.
# Escape hatch stays `minimumReleaseAgeExclude` (names, @scope/* globs, or
# exact `pkg@version` entries).
minimumReleaseAgeStrict: true

# Transitive-CVE remediation. `@bacons/xcode` (both published alphas) pins
# `@expo/plist@^0.0.18`, which pins `@xmldom/xmldom@~0.7.0` — and 0.7.x is
# affected by GHSA-wh4c-j3r5-mjhp (HIGH, CDATA terminator injection on
# serialize) with NO 0.7 patch: the fix starts at 0.8.12. Newer @expo/plist
# releases already sit on ^0.8.8, so 0.8.x is the version @expo/plist's own
# code is written against; this override just drags the pinned-back copy
# forward. It is build-time only — plist editing during `expo prebuild`,
# never bundled into a watch app — but a HIGH with a one-line remedy is not
# worth carrying. Verified by a full `expo prebuild` after the override.
# Consumers need the same line in their own workspace (they install
# @bacons/apple-targets themselves — it is our peer, not our dependency);
# SECURITY.md carries the copy-paste.
overrides:
  '@xmldom/xmldom@~0.7.0': ^0.8.12
  # brace-expansion DoS (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p): the tree
  # held 2.1.1 (minimatch 9, ^2.0.2) and 5.0.6 / 5.0.9 (minimatch 10, ^5.0.5 /
  # ^5.0.8). Patched in 2.1.6 / 5.0.11, inside those ranges and published
  # 2026-09-14, past the 7-day cooldown, so this raises the floor instead of
  # baselining. Reached only through @bacons/apple-targets and expo (config
  # plugins, @expo/cli) in the workspace installs; never bundled into a
  # watch app.
  'brace-expansion@^2': ^2.1.6
  'brace-expansion@^5': ^5.0.11

# Advisory baseline for the `pnpm audit --audit-level=high` gate in
# security.yml. Every GHSA here was already open against this lockfile when
# the gate went in (2026-09-17: 34 high findings, 24 advisories, all
# transitive through the Expo 57 / react-native toolchain); listing them is
# what lets the NEXT advisory fail the run instead of drowning in a red
# baseline. This file, not `pnpm audit --ignore`: under pnpm 11 that flag
# WRITES the ids (merged with the existing ones) into the deprecated
# `auditConfig.ignoreGhsas` key and exits 0 — it is an editor, not a filter —
# so a workflow that passed it would never gate anything. When both keys
# exist this `audit.ignore` list wins. The key is read
# from pnpm 11.16 on (the pinned packageManager is 11.18); an older pnpm
# ignores it and prints the full list.
#
# Removal: the fix is a lockfile refresh, not a longer list. The 2026-10-03
# refresh (`pnpm update -r --depth Infinity` on the affected packages, inside
# the ranges their dependents already accept) moved @xmldom/xmldom, shell-quote
# and browserslist to patched versions and deleted their entries; js-yaml and
# nanoid had already resolved to patched versions, so their entries were stale
# and went too. The 2026-10-03 in-range refresh then dropped image-size 1.2.1
# from the lockfile entirely, so its two entries went as well. Two baselined
# packages remain, neither fixable by a refresh: node-forge / braces have
# patched releases that are not on npm yet (below). When one of those lands,
# DELETE the entries it fixes — pnpm 11 does not report a stale ignore, so a
# forgotten one silently hides a real recurrence. `pnpm audit --audit-level=high` with the
# entries removed is the proof that the bump took.
audit:
  ignore:
    # node-forge 1.4.0 (under @expo/cli and @expo/code-signing-certificates,
    # both ^1.3.3); patched in 1.4.1, which is not published to npm as of
    # 2026-10-03 (latest is 1.4.0), so no override or refresh can install it.
    # First failed the gate on 2026-10-03. Expo CLI tooling in the workspace
    # installs; never bundled into a watch app.
    - GHSA-86w9-cpqp-85rv
    # braces 3.0.3 (under micromatch 4.0.8 via metro-file-map, ^3.0.3);
    # patched in 3.0.4, which is not published to npm as of 2026-10-03
    # (latest is 3.0.3), so no override or refresh can install it. First
    # failed the gate on 2026-10-03. Metro bundler file crawling in the `app`
    # workspace only; never bundled into a watch app.
    - GHSA-vfj7-8cjw-p6xm

# Lifecycle-script allowlist (pnpm 11 home of package.json's former
# pnpm.onlyBuiltDependencies): only the toolchain binaries we actually
# execute during build/test; everything else stays sandboxed.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
