# gitleaks config for react-native-watchos.
#
# Run a clean secret scan of the project:
#   gitleaks dir projects/react-native-watchos --config projects/react-native-watchos/.gitleaks.toml
#
# Extends the default ruleset; the allowlist only suppresses KNOWN false
# positives in build artifacts / vendored code (never our own source):
#   - CocoaPods `_CodeSignature/CodeResources` plists match generic-api-key on
#     their XML `<key>…</key>` tags (e.g. `<key>ios-arm64_x86_64-maccatalyst</key>`).
#   - `.xcframework`, `node_modules`, `dist`, `.build`, DerivedData are generated
#     or third-party and not committed.
# Our tracked source is scanned normally: OTA signing keys are GENERATED by
# scripts/ota-keygen.ts and read from files at sign time — none are embedded.

[extend]
useDefault = true

[allowlist]
description = "Vendored deps and build artifacts — not first-party source"
paths = [
  '''.*/Pods/.*''',
  '''.*/_CodeSignature/CodeResources''',
  '''.*\.xcframework/.*''',
  '''.*/node_modules/.*''',
  '''.*/dist/.*''',
  '''.*/\.build/.*''',
  '''.*/DerivedData/.*''',
]
