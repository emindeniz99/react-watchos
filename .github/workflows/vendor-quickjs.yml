name: vendor quickjs-ng

# Watches quickjs-ng for releases and proposes the bump as a PR that has
# already proved itself.
#
# Why a bot at all: the engine is the runtime AND the trust base — it executes
# every signed OTA bundle — so falling silently behind upstream is how a fixed
# crash or a fixed parser bug stays in our product for a year. Nobody checks a
# releases page on a schedule; a workflow does.
#
# Why it waits (the soak): the release that lands today is the one most likely
# to be replaced within the week, and vendoring on day one means vendoring the
# version that got hotfixed. The policy lives in
# js/scripts/pick-quickjs-release.ts with its own tests — read it there — but in
# short: propose the newest release that is ≥ SOAK_DAYS old, and if something
# newer has since appeared, say so at the top of the PR in a warning block
# instead of quietly proposing the older one.
#
# Why it runs the gates itself: a PR opened with the built-in GITHUB_TOKEN
# raises no `pull_request` event, so CI would never run on it. ci.yml and
# build.yml are therefore CALLED as reusable workflows from this run, against
# the pushed branch — including the macOS watch build, which is the only place
# CQuickJS is compiled for arm64_32.
#
# What it deliberately does NOT do: attest the tarball. The bot hashes the file
# it just downloaded, which proves nothing about that file (M9 wants a second
# channel). A human confirms the digest and adds the `engine-digest-attested`
# label; engine-attest.yml fails the PR until they do.

on:
  schedule:
    # Daily, at an odd minute so it does not queue behind the top-of-hour rush.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      soak_days:
        description: "Override the soak window in days"
        type: string
        default: "7"
        required: false

permissions: {}

# Never two bumps in flight: they would fight over the same branch.
concurrency:
  group: vendor-quickjs
  cancel-in-progress: false

env:
  # Tags a human has marked known-bad. The bot skips them as if upstream had
  # never published them, and says so in the PR body.
  SKIP_TAGS: ""

jobs:
  # ── 1. Decide, vendor, push ────────────────────────────────────────────────
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      propose: ${{ steps.decide.outputs.propose }}
      tag: ${{ steps.decide.outputs.tag }}
      branch: ${{ steps.decide.outputs.branch }}
      body: ${{ steps.body.outputs.b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Decide whether anything has soaked
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOAK_DAYS: ${{ inputs.soak_days || '7' }}
        run: |
          node --experimental-strip-types js/scripts/pick-quickjs-release.ts > pick.json
          action=$(jq -r .action pick.json)
          tag=$(jq -r .tag pick.json)
          {
            echo "propose=$([ "$action" = propose ] && echo true || echo false)"
            echo "tag=$tag"
            echo "branch=chore/vendor-quickjs-ng"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### quickjs-ng watch"
            echo
            echo "- vendored: \`$(jq -r .vendoredTag pick.json)\`"
            echo "- decision: **$action** — $(jq -r .reason pick.json)"
            echo "- soaking above the candidate: $(jq -r .soakingCount pick.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The engine numbers BEFORE the bump, so the PR can state the delta rather
      # than an absolute nobody can calibrate. Cheap: the objects are cached
      # per stamp, and this is the last time they exist for the old engine.
      - name: Measure the current engine
        if: steps.decide.outputs.propose == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter react-watchos build:min
          pnpm --filter react-watchos build:bytecode
          sh tools/embed-smoke/run.sh 2>&1 | tee before.txt

      - name: Re-vendor
        id: vendor
        if: steps.decide.outputs.propose == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          url="https://github.com/quickjs-ng/quickjs/archive/refs/tags/$TAG.tar.gz"
          curl -fsSL "$url" -o upstream.tar.gz
          sha=$(sha256sum upstream.tar.gz | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          # The vendoring script is the same one a human runs by hand, digest
          # and all — the bot is not allowed a shortcut the maintainer does not
          # have.
          sh tools/vendor-quickjs/run.sh "$TAG" "$sha"

      # Our build compiles exactly four upstream .c files. If upstream splits
      # the engine into a fifth, the vendored tree still COMPILES and silently
      # drops whatever moved there — a failure that would surface as a runtime
      # mystery months later. Fail the bump instead.
      - name: Upstream source set still matches ours
        if: steps.decide.outputs.propose == 'true'
        run: |
          tar -xzf upstream.tar.gz
          root=$(find . -maxdepth 1 -name 'quickjs-*' -type d | head -1)
          # qjs_sources in upstream's CMakeLists is the authoritative list.
          upstream=$(sed -n '/set(qjs_sources/,/)/p' "$root/CMakeLists.txt" \
            | grep -oE '[a-z0-9_]+\.c' | sort -u | tr '\n' ' ')
          ours="dtoa.c libregexp.c libunicode.c quickjs.c "
          echo "upstream: $upstream"
          echo "ours:     $ours"
          if [ "$upstream" != "$ours" ]; then
            echo "::error::upstream's compiled source set changed — tools/vendor-quickjs/run.sh and VERSION.md need a human before this bump can land"
            exit 1
          fi
          rm -rf "$root" upstream.tar.gz

      - name: Measure the proposed engine
        if: steps.decide.outputs.propose == 'true'
        run: |
          pnpm --filter react-watchos build:bytecode
          sh tools/embed-smoke/run.sh 2>&1 | tee after.txt

      - name: Render the PR body
        id: body
        if: steps.decide.outputs.propose == 'true'
        run: |
          node --experimental-strip-types js/scripts/pick-quickjs-release.ts \
            --render pick.json "${{ steps.vendor.outputs.sha256 }}" > body.md
          {
            echo
            echo "### Engine measurements (this run, Linux x86_64 — not a watch)"
            echo
            echo "| | before | after |"
            echo "|---|---|---|"
            echo "| heap / boot | $(grep -h '\[mem\]\|\[boot\]' before.txt | tr '\n' ' ') | $(grep -h '\[mem\]\|\[boot\]' after.txt | tr '\n' ' ') |"
            echo
            echo "Numbers are from \`tools/embed-smoke/run.sh\` — the vendored engine plus the"
            echo "reference C host, i.e. the embedding sequence JSRuntime.swift uses. Boot time"
            echo "on a shared runner is noisy; treat a <10% move as noise and the heap figure as"
            echo "the real signal."
          } >> body.md
          # base64 so a multi-line body survives job outputs without quoting games.
          echo "b64=$(base64 -w0 body.md)" >> "$GITHUB_OUTPUT"

      # One long-lived branch, force-updated: the PR is a standing proposal that
      # retargets itself as upstream moves, rather than a graveyard of stale
      # per-version PRs. Guarded — if a human has pushed onto the branch, the
      # bot backs off rather than discarding their work.
      - name: Push the branch
        if: steps.decide.outputs.propose == 'true'
        env:
          BRANCH: ${{ steps.decide.outputs.branch }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            author=$(git log -1 --format='%an' "origin/$BRANCH" 2>/dev/null || echo "")
            if [ -n "$author" ] && [ "$author" != "github-actions[bot]" ]; then
              echo "::error::$BRANCH carries a commit by $author — refusing to force-update someone else's work"
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(deps): vendor quickjs-ng $TAG

          Proposed by .github/workflows/vendor-quickjs.yml after the release
          soaked. The tarball digest still needs a human's out-of-band check —
          see the PR body."
          git push --force-with-lease -u origin "$BRANCH"

  # ── 2. Prove it, using the SAME gates main uses ────────────────────────────
  gates:
    needs: propose
    if: needs.propose.outputs.propose == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.propose.outputs.branch }}

  watch-build:
    needs: propose
    if: needs.propose.outputs.propose == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.propose.outputs.branch }}

  # ── 3. Open or update the PR, with the gate results in it ──────────────────
  pull-request:
    needs: [propose, gates, watch-build]
    # `always()` so a RED gate still produces the PR — a bump that breaks the
    # build is exactly the thing worth seeing, and hiding it would make the bot
    # look like upstream had published nothing.
    if: always() && needs.propose.outputs.propose == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Open or update
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.propose.outputs.branch }}
          TAG: ${{ needs.propose.outputs.tag }}
          BODY_B64: ${{ needs.propose.outputs.body }}
          GATES: ${{ needs.gates.result }}
          WATCH: ${{ needs.watch-build.result }}
        run: |
          echo "$BODY_B64" | base64 -d > body.md
          {
            echo
            echo "### Gates (run against this branch, in the bot's own run)"
            echo
            echo "- Linux CI (\`ci.yml\`): **$GATES**"
            echo "- watchOS build (\`build.yml\`): **$WATCH**"
            echo
            echo "<sub>Opened by \`.github/workflows/vendor-quickjs.yml\`. The branch is"
            echo "force-updated as upstream moves, so this PR always proposes the current"
            echo "soaked candidate.</sub>"
          } >> body.md
          title="chore(deps): vendor quickjs-ng $TAG"
          if existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number') && [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file body.md
            echo "updated #$existing"
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body-file body.md
          fi
