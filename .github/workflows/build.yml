name: watch build

# On-demand macOS compile check for the watchOS Swift (watch app + widget
# extension). The targets are generated by `expo prebuild` via
# @bacons/apple-targets, then compiled with code signing disabled — this
# verifies the Swift/QuickJS bridge compiles, not that it's signable.
#
# NOTE: repo-level GitHub Actions are currently DISABLED (B1) — these
# workflows run once the owner enables Actions; nothing else is needed.

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version (e.g. 16.2, 26.0, latest-stable)"
        default: "latest-stable"
        required: false
  # Callable from another workflow — see the same block in ci.yml for why. An
  # engine bump is exactly the change this macOS job exists for: CQuickJS is
  # compiled for arm64_32 here and nowhere else, so the bot runs it on the
  # vendor branch before asking anyone to look at the PR.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out. Empty = the caller's own ref."
        type: string
        required: false
      xcode:
        description: "Xcode version"
        type: string
        default: "latest-stable"
        required: false
  # CX-013 REVERSED, 2026-08-20 (maintainer's call). That decision — "native
  # compilation is not a required PR gate" — was made when the plugin was
  # simpler and the only native surface was a SwiftUI shell. It is now the
  # watchOS half of the health bridge, the SwiftUI host and the widget infra,
  # all of which compile to an EMPTY module off-watchOS, so `swift test` on
  # Linux proves nothing about them (NF-30). Under the old rule the feedback
  # was a nightly: long enough that whoever broke it had moved on, and the
  # 2026-08-07..08-10 run of red nightlies is what that costs in practice.
  #
  # So this now runs on pull_request too, and the maintainer marks the three
  # jobs as required checks in branch protection. The path filter is what
  # keeps it affordable — a docs or renderer PR spins up no macOS runner —
  # and `concurrency` above cancels superseded runs on the same PR.
  pull_request:
    paths:
      - "js/swift/**"
      - "js/plugin/**"
      - "app/**"
      - ".github/workflows/build.yml"
  # Post-merge as well as pre-merge: a PR that merges clean can still break
  # main when another PR lands between its last run and the merge.
  push:
    branches: [main]
    paths:
      - "js/swift/**"
      - "js/plugin/**"
      - "app/**"
      - ".github/workflows/build.yml"
  # Nightly: catches the breakage a path filter cannot see — an Xcode or
  # apple-targets release moving under us with no commit of ours involved.
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: rnwatchos-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

# Least privilege: nothing here writes to the repo; the GITHUB_TOKEN is
# read-only even if the repo default ever changes.
permissions:
  contents: read

jobs:
  # Swift style gate. Separate job so it runs in parallel with the compile
  # check below. The project formats with APPLE swift-format (part of the
  # Swift 6 toolchain — `swift format`), NOT Nick Lockwood's SwiftFormat or
  # SwiftLint; this job runs the same `format:swift:check` script the local
  # battery uses, so CI and dev can't disagree on style.
  swift-lint:
    runs-on: macos-26 # arm64 (Apple Silicon); ships the Xcode 26.x toolchain our watchOS 26.2 SDK build expects
    timeout-minutes: 15
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Empty on push/PR — checkout then uses the event's own default ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ inputs.xcode || 'latest-stable' }}
      - name: swift-format (check only)
        run: npm run format:swift:check

  # Run the Swift package's unit tests INSIDE the watchOS simulator.
  # xcodebuild can test a SwiftPM package directly on a simulator destination,
  # whereas `swift test` only runs on the host — so this is what exercises the
  # QuickJS engine + wire models on the real watch architecture. The Linux CI
  # runs the same tests via `swift test` (host arch) on every push.
  watchos-tests:
    runs-on: macos-26 # arm64 (Apple Silicon); ships the Xcode 26.x toolchain our watchOS 26.2 SDK build expects
    timeout-minutes: 20
    defaults:
      run:
        working-directory: js/swift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Empty on push/PR — checkout then uses the event's own default ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ inputs.xcode || 'latest-stable' }}

      # BundleSmokeTests boots the REAL production bundle (js/dist/bundle.js
      # and the .qbc next to it) through JSRuntime on the simulator — the only
      # place the shipped artifact meets the shipped embedding on the watch
      # architecture. Those files are build products, not fixtures, so without
      # the steps below the test would SKIP and this job would look green while
      # proving nothing. (The `build` job below already does this for the Xcode
      # build; this job never needed a bundle until now.)
      #
      # No `version` input: pnpm/action-setup reads the exact pinned version
      # from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 24: `pnpm build` runs scripts/build.ts through Node's native type
          # stripping (matches .mise.toml and the other jobs).
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (pnpm workspace)
        working-directory: .
        run: pnpm install --frozen-lockfile
      # build:bytecode links the vendored quickjs-ng, which is ~30 s of C to
      # compile cold and free warm — same cache directory and key as ci.yml, so
      # a macOS runner keeps its own (the stamp hashes `uname -sm` too).
      - name: Cache the vendored quickjs-ng build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/react-watchos/vendored-qjs
          key: qjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('js/swift/Sources/CQuickJS/**', 'tools/vendored-qjs/main.c', 'tools/vendored-qjs/build.sh') }}
      - name: Build the JS bundle + bytecode (BundleSmokeTests inputs)
        working-directory: .
        run: |
          pnpm --filter react-watchos build
          pnpm --filter react-watchos build:bytecode

      - name: Test on watchOS simulator (xcodebuild)
        env:
          # xcodebuild strips the TEST_RUNNER_ prefix and passes the rest into
          # the test process, so the tests see REQUIRE_BUNDLE=1: a missing
          # js/dist artifact FAILS here instead of skipping (the REQUIRE_QJS
          # posture from the JS engine gate). If a future Xcode stops
          # forwarding it, the test degrades to skipping — the pre-2026-08-21
          # behaviour — rather than failing spuriously.
          TEST_RUNNER_REQUIRE_BUNDLE: "1"
        run: |
          set -o pipefail
          WATCH_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((v['udid'] for rt,ds in d['devices'].items() if 'watchOS' in rt for v in ds), ''))")
          echo "watch sim: $WATCH_ID"
          xcodebuild test -scheme ReactWatchHost-Package \
            -destination "platform=watchOS Simulator,id=$WATCH_ID" \
            2>&1 | tee test-watchos.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchos-test-log
          path: js/swift/test-watchos.log
          if-no-files-found: ignore

  build:
    runs-on: macos-26 # arm64 (Apple Silicon); ships the Xcode 26.x toolchain our watchOS 26.2 SDK build expects
    timeout-minutes: 40
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Empty on push/PR — checkout then uses the event's own default ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ inputs.xcode || 'latest-stable' }}

      - name: Toolchain versions
        run: |
          xcodebuild -version
          echo "--- installed watch SDKs ---"
          xcodebuild -showsdks | grep -i watch || true
          node --version
          ruby --version
          pod --version

      # No `version` input: pnpm/action-setup reads the exact pinned version
      # from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 24: dev tooling is real .ts run via Node's native type stripping
          # (matches .mise.toml). `pnpm build` runs scripts/build.ts directly.
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One pnpm install at the workspace root covers js + app + examples.
      - name: Install (pnpm workspace)
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Build the JS bundle (the watch + widget targets ship it as a
      # resource). It's gitignored, not committed, so this step is what
      # produces it before prebuild + the Xcode build.
      - name: Build JS bundle
        working-directory: .
        run: pnpm --filter react-watchos build

      # Generate the native iOS project (and the apple-targets watch +
      # widget targets). --no-install only skips expo's own install step —
      # CocoaPods runs explicitly right after, because the verified build
      # shape is prebuild + pod install + `-workspace` + the "React Watch"
      # SCHEME (see docs/running-on-sim.md and js/scripts/run-watch-sim.sh).
      # Building with `-project`/`-target` straight off a --no-install
      # prebuild produces FALSE missing-module errors.
      - name: Expo prebuild (generate Xcode project)
        working-directory: app
        run: npx expo prebuild -p ios --clean --no-install

      - name: Pod install (generates the .xcworkspace)
        working-directory: app/ios
        run: pod install

      - name: Inspect generated workspace
        working-directory: app
        run: |
          echo "--- ios/ tree (depth 2) ---"
          find ios -maxdepth 2 -mindepth 1 | sort
          # find, not `ls -d ios/*.xcworkspace`: shellcheck SC2012, and the
          # glob would expand to the literal pattern if prebuild produced no
          # workspace, silently setting WORKSPACE to a path that does not exist.
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "--- schemes ---"
          xcodebuild -workspace "$WORKSPACE" -list || true

      # Compile the "React Watch" scheme. apple-targets sets the widget
      # extension as an embed dependency, so this also compiles the widget
      # (and the vendored quickjs-ng C + the Swift/QuickJS bridge). Signing
      # is disabled: this verifies the build compiles, nothing is installed
      # or launched here (the App-Group re-sign dance in run-watch-sim.sh
      # only matters when actually running the app).
      - name: Build "React Watch" scheme (watchOS simulator, no signing)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "React Watch" \
            -configuration Debug \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build-watch.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcodebuild-logs
          path: app/build-watch.log
          if-no-files-found: ignore
