name: react-native-watchos swift build

# On-demand macOS compile check for the watchOS Swift (watch app + widget
# extension). The targets are generated by `expo prebuild` via
# @bacons/apple-targets, then compiled with code signing disabled — this
# verifies the Swift/QuickJS bridge compiles, not that it's signable.
#
# NOTE: repo-level GitHub Actions are currently DISABLED (B1) — these
# workflows run once the owner enables Actions; nothing else is needed.

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version (e.g. 16.2, 26.0, latest-stable)"
        default: "latest-stable"
        required: false
  # Nightly: the pbxproj-editing plugin and the SwiftUI host are the most
  # fragile surfaces in the repo and Linux CI can't compile them (NF-30) —
  # a scheduled run catches breakage within a day instead of at the next
  # manual dispatch. (CX-013's "not a PR gate" decision stands.)
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: rnwatchos-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  # Swift style gate. Separate job so it runs in parallel with the compile
  # check below. The project formats with APPLE swift-format (part of the
  # Swift 6 toolchain — `swift format`), NOT Nick Lockwood's SwiftFormat or
  # SwiftLint; this job runs the same `format:swift:check` script the local
  # battery uses, so CI and dev can't disagree on style.
  swift-lint:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ github.event.inputs.xcode || 'latest-stable' }}
      - name: swift-format (check only)
        run: npm run format:swift:check

  # Run the Swift package's unit tests INSIDE the watchOS simulator.
  # xcodebuild can test a SwiftPM package directly on a simulator destination,
  # whereas `swift test` only runs on the host — so this is what exercises the
  # QuickJS engine + wire models on the real watch architecture. The Linux CI
  # runs the same tests via `swift test` (host arch) on every push.
  watchos-tests:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: js/swift
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ github.event.inputs.xcode || 'latest-stable' }}
      - name: Test on watchOS simulator (xcodebuild)
        run: |
          set -o pipefail
          WATCH_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((v['udid'] for rt,ds in d['devices'].items() if 'watchOS' in rt for v in ds), ''))")
          echo "watch sim: $WATCH_ID"
          xcodebuild test -scheme ReactWatchHost-Package \
            -destination "platform=watchOS Simulator,id=$WATCH_ID" \
            2>&1 | tee test-watchos.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchos-test-log
          path: js/swift/test-watchos.log
          if-no-files-found: ignore

  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ github.event.inputs.xcode || 'latest-stable' }}

      - name: Toolchain versions
        run: |
          xcodebuild -version
          echo "--- installed watch SDKs ---"
          xcodebuild -showsdks | grep -i watch || true
          node --version
          ruby --version
          pod --version

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          # 24: dev tooling is real .ts run via Node's native type stripping
          # (matches .mise.toml). `pnpm build` runs scripts/build.ts directly.
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One pnpm install at the workspace root covers js + app + examples.
      - name: Install (pnpm workspace)
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Build the JS bundle (the watch + widget targets ship it as a
      # resource). It's gitignored, not committed, so this step is what
      # produces it before prebuild + the Xcode build.
      - name: Build JS bundle
        working-directory: .
        run: pnpm --filter react-watchos build

      # Generate the native iOS project (and the apple-targets watch +
      # widget targets). --no-install skips CocoaPods/React Native pods:
      # our watch targets have no pod dependencies, so we can compile them
      # straight from the .xcodeproj without building all of RN.
      - name: Expo prebuild (generate Xcode project)
        working-directory: app
        run: npx expo prebuild -p ios --clean --no-install

      - name: Inspect generated project
        working-directory: app
        run: |
          echo "--- ios/ tree (depth 2) ---"
          find ios -maxdepth 2 -mindepth 1 | sort
          PROJ=$(ls -d ios/*.xcodeproj | head -1)
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "--- targets & schemes ---"
          xcodebuild -project "$PROJ" -list || true

      # Compile the watch app target. apple-targets sets the widget
      # extension as an embed dependency, so this also compiles the widget
      # (and the vendored quickjs-ng C + the Swift/QuickJS bridge).
      - name: Build watch app target (watchOS simulator, no signing)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJ" \
            -target "React Watch" \
            -sdk watchsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build-watch.log

      # Build the widget extension on its own too, in case it isn't reached
      # as a dependency of the watch app build above. continue-on-error so
      # we always see both logs in one run.
      - name: Build widget extension target (watchOS simulator, no signing)
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJ" \
            -target "React Watch Widgets" \
            -sdk watchsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build-widget.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            app/build-watch.log
            app/build-widget.log
          if-no-files-found: ignore
