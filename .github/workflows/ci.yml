name: CI

# Fast Linux checks on every push/PR: the JS renderer (tsc, vitest, real
# qjs + C-embed smoke, codegen drift) and the Swift wire-contract tests
# (compile the generated Foundation-only models, decode real fixtures).
# The SwiftUI/WidgetKit build is the separate on-demand macOS workflow.

on:
  workflow_dispatch:
  # Callable from another workflow, because of a GitHub rule that would
  # otherwise leave the engine-bump bot's PR ungated: events raised with the
  # built-in GITHUB_TOKEN do not start workflows, so a PR the bot opens gets no
  # `pull_request` run. Rather than copy these steps into that workflow (a copy
  # rots the day someone adds a gate here), the bot CALLS this file and the
  # gates run inside its own run, against the branch it just pushed.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out. Empty = the caller's own ref."
        type: string
        required: false
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo; the GITHUB_TOKEN is
# read-only even if the repo default ever changes.
permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Empty on push/PR — checkout then uses the event's own default ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # No `version` input: pnpm/action-setup reads the exact pinned version
      # from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 24: the dev tooling (scripts/, codegen/) is real .ts run directly by
          # Node's native type stripping — matches the project's .mise.toml pin.
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The engine gate runs the engine this repo SHIPS. `apt-get install
      # quickjs` used to provide it, and that was wrong from the start: the
      # package is Bellard's QuickJS ("version 2021-03-27"), a different engine
      # from the vendored quickjs-ng 0.16.1 the watch runs — measurably so, since
      # the same minified bundle reports `at o (min.js)` there against
      # `at n (min.js:1:30)` here. So nothing is downloaded: build.sh compiles
      # js/swift/Sources/CQuickJS, the sources SwiftPM also compiles for watchOS.
      #
      # ~30 s cold, free warm. The cached path is the per-user cache directory
      # build.sh writes to (it keeps build output out of the checkout and lets a
      # second clone reuse the build); QJS_BUILD_DIR would override it. Keyed per
      # runner OS + arch, so a macOS job can never restore a Linux binary — and
      # build.sh's own stamp hashes `uname -sm` too, so a restored-but-wrong
      # artifact rebuilds instead of failing to exec.
      - name: Cache the vendored quickjs-ng build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/react-watchos/vendored-qjs
          key: qjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('js/swift/Sources/CQuickJS/**', 'tools/vendored-qjs/main.c', 'tools/vendored-qjs/build.sh') }}
      - name: Build the vendored quickjs-ng
        run: echo "QJS_BIN=$(tools/vendored-qjs/build.sh)" >> "$GITHUB_ENV"
      - name: Install (pnpm workspace)
        run: pnpm install --frozen-lockfile
      - name: Codegen is up to date
        run: pnpm --filter react-watchos codegen -- --check
      - name: Lint + format (Biome)
        run: pnpm --filter react-watchos lint
      - name: Typecheck (strict; src + tests)
        run: pnpm --filter react-watchos typecheck
      - name: Build bundle
        run: pnpm --filter react-watchos build
      - name: Bundle size budget (minified)
        run: pnpm --filter react-watchos check:size
      - name: Test (vitest + the vendored engine)
        # REQUIRE_QJS turns the local-dev "no C compiler -> skip" guard into a
        # loud failure here: this job built the engine above, so a skip would
        # mean the engine-compat gate silently stopped running. QJS_BIN points
        # the suite at that build instead of anything on PATH.
        env:
          REQUIRE_QJS: "1"
        run: pnpm --filter react-watchos test
      # Each example is a real consumer: it resolves react/react-reconciler
      # itself and bundles them together with the renderer. `build` is the
      # load-bearing step — the preset's single-copy check reads the module
      # graph and fails if a bundle would ship two copies of react (which
      # breaks hooks at boot, and which typecheck/test cannot see: tsc reads
      # one @types/react and the vitest configs set `resolve.dedupe`).
      - name: Examples build a single-React bundle (typecheck/build/test)
        run: |
          pnpm --filter minimal-watch-app typecheck
          pnpm --filter minimal-watch-app build
          pnpm --filter minimal-watch-app test
          pnpm --filter expo-watch-app typecheck
          pnpm --filter expo-watch-app build:targets
          pnpm --filter expo-watch-app test
      - name: C-embed smoke (vendored quickjs-ng)
        working-directory: js
        run: ../tools/embed-smoke/run.sh
      - name: Tree-commit bench in the vendored engine (NF-20)
        working-directory: js
        run: ../tools/embed-smoke/bench.sh
      - name: Bytecode compiles + loads (qjs-compile)
        working-directory: js
        run: |
          pnpm build:bytecode
          ../tools/embed-smoke/embed-host dist/bundle.qbc
      - name: Fixtures committed match the serializer
        run: git diff --exit-code -- js/swift/Tests/ReactWatchTests/Fixtures
      # M12: the committed API reference (typedoc + schema-emitted capability
      # tables) must match the source — regenerate and fail on drift, the same
      # posture as the codegen and fixtures checks above.
      - name: API docs are up to date
        run: |
          pnpm --filter react-watchos docs:api
          # add -A first: `git diff` alone never sees NEWLY generated pages
          # (untracked), so a missed page would pass the gate silently.
          git add -A docs/api
          git diff --cached --exit-code -- docs/api

  swift-package:
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: js/swift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Empty on push/PR — checkout then uses the event's own default ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # On Linux the manifest excludes the SwiftUI host target, so the whole
      # package builds (quickjs-ng C module, wire models, JS embedding) and
      # `swift test` decodes the real serializer fixtures via ReactWatchCore.
      # ReactWatchHost needs Xcode — the separate macOS workflow.
      - name: Build (SwiftPM)
        run: swift build
      # NB `BundleSmokeTests` (the real production bundle booted through
      # JSRuntime) SKIPS here, on purpose. It needs js/dist/bundle.js + .qbc,
      # and this container is swift:6.0 with no Node — Debian's nodejs is too
      # old for the `--experimental-strip-types` the build scripts are written
      # against, so making it run means either downloading a Node tarball per
      # run or making this job wait on `js` for an artifact, serializing two
      # jobs that are parallel today. Neither buys anything: the SAME bundle is
      # already booted in this workflow by the C-embed smoke (`js` job, the
      # reference embedding), and the run that actually matters — the shipped
      # artifact in the shipped Swift embedding on the watch architecture — is
      # `watchos-tests` in build.yml, which does build the bundle first.
      # Locally the test RUNS whenever `pnpm --filter react-watchos build` has
      # been run, which is the normal state of a dev checkout.
      - name: Wire-contract tests
        run: swift test
      # Exits 0 as of the tail-sweep format pass; this keeps warnings from
      # silently re-accumulating. The swift:6.0 container has no Node, so this
      # invokes `swift format` directly — it MUST stay in sync with the
      # `format:swift:check` script in js/package.json (same command, run
      # from js/ where that script lives).
      - name: swift-format lint
        working-directory: js
        run: swift format lint -s -r -p swift/Sources swift/Tests ../app/targets

  # The declared engine floor, walked on the CONSUMER path. js/package.json
  # says `node >=22.18`; every other job here pins 24 because the dev tooling
  # is typed .ts run through native type stripping, so nothing had ever loaded
  # the shipped artifact on the floor it claims — and the shipped artifact is
  # a different thing from the workspace: Node refuses to type-strip under
  # node_modules, which is how 0.1.0's entry points worked in-repo and crashed
  # on every registry install. Pack on 24 (the `prepare` hook needs it), then
  # `npm install` the tarball into a scratch project on 22.18.0 and load each
  # Node-loaded surface: the bin, the Expo config plugin, the esbuild preset
  # and the manifest signer. Not the vitest suite — that is 24-only by design
  # (CONTRIBUTING.md, "Verifying changes"). Raise the floor and this pin
  # together.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Empty on push/PR — checkout then uses the event's own default ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # No `version` input: pnpm/action-setup reads the exact pinned version
      # from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (pnpm workspace)
        run: pnpm install --frozen-lockfile
      - name: Pack the tarball (Node 24 — `prepare` compiles dist-node/)
        working-directory: js
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      # Second setup-node in the same job: from here on PATH is the floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
      # zizmor flags any install outside a lockfile; installing the tarball
      # this job just packed, the way a consumer would, IS the check.
      - name: Install the tarball with npm on the floor
        working-directory: ${{ runner.temp }}
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          node --version
          mkdir consumer && cd consumer
          npm init -y >/dev/null
          # npm resolves the required peers (react, react-reconciler) itself;
          # the optional ones stay out, exactly as in a consumer that has not
          # installed Expo. `--ignore-scripts` is NOT passed: the package has
          # no install scripts, and a future one should run here.
          npm install "$RUNNER_TEMP"/pack/react-watchos-*.tgz
      - name: Node-loaded surfaces load on the floor
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          # The bin: no arguments prints usage and exits 0 (a flag is an
          # unknown command and exits 1), so bare is the smoke.
          ./node_modules/.bin/react-watchos
          # The Expo config plugin, the way Expo's resolver loads it — a CJS
          # require() of the ESM app.plugin.js, which is what needs >= 22.12.
          node -e '
            const m = require("react-watchos/app.plugin");
            if (typeof (m.default ?? m) !== "function") throw new Error("app.plugin did not export a function");
          '
          # The esbuild preset and the OTA manifest signer, the two ESM
          # entry points a consumer's build script imports.
          node --input-type=module -e '
            const build = await import("react-watchos/build");
            if (typeof build.watchBuildOptions !== "function") throw new Error("react-watchos/build: no watchBuildOptions");
            const manifest = await import("react-watchos/manifest");
            const key = manifest.generateSigningKey();
            if (!key.keyId || !key.publicKeyBase64) throw new Error("react-watchos/manifest: generateSigningKey returned no key");
          '
