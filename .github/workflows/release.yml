name: release

# ONE run, three stages: release-please cuts the release, ci.yml, quality.yml
# and build.yml re-run as called workflows on the commit the tag names, then
# the npm publish happens in the SAME run, gated on all of it.
#
# The called workflows take no `ref`: they check out the run's own commit, and
# job 1 refuses to publish unless that commit IS the tagged one. So the gates,
# the publish checkout and the tag are the same tree by construction, and no
# workflow here ever checks out one commit inside a run scoped to another
# (the shape CodeQL reports as cache poisoning). The price is in the RUNBOOK:
# a publish that must be retried is retried by dispatching this workflow ON
# THE TAG, not by pushing to main.
#
# - The FILENAME release.yml is load-bearing — npm's trusted publisher config
#   matches on organization/user + repository + WORKFLOW FILENAME (basename,
#   case-sensitive), and a package may have only ONE trusted publisher at a
#   time. NEVER rename this file: renaming it revokes this workflow's ability
#   to publish until a maintainer re-points npm's config by hand.
# - No npm token anywhere: `id-token: write` on the publish job lets npm
#   authenticate the run directly, and provenance is attached automatically
#   (no `--provenance` flag). Adding `registry-url` or `NODE_AUTH_TOKEN` to
#   setup-node would BREAK OIDC, so neither appears below.
#
# Why the publish is not its own workflow, and why `release: published` is
# gone: release-please creates the GitHub Release with the built-in
# GITHUB_TOKEN, and GitHub does not start workflow runs from events raised by
# that token (only workflow_dispatch and repository_dispatch are exempt). That
# trigger therefore never fired once — 0.2.0, 0.2.1, 0.3.0, 0.4.0 and 0.5.0 all
# had to be published by a hand dispatch.
#
# RUNBOOK
# - Normal release: merge the release-please PR. Nothing manual. That push runs
#   job 1 (tags + creates the Release), the called gates against the tag, and
#   then job 2 (publishes THAT TAG).
# - A publish that failed: re-run the failed job, or dispatch this workflow ON
#   THE TAG (Actions → release → Run workflow → pick the tag, or
#   `gh workflow run release.yml --ref react-watchos-vX.Y.Z`). Both converge on
#   the same gate, which publishes only what is missing from the registry —
#   re-runs are green no-ops. A push to main, or a dispatch on main, finishes
#   the release only while main's HEAD is still the tagged commit; once main
#   has moved on, job 1 fails RED with the dispatch command, and keeps doing
#   so on every push until the tag is published or the next release moves the
#   manifest past it. Red on purpose: a tagged Release with no npm version is
#   a broken state, and the gates may only ever run on the tagged tree.
# - A red `gates`/`quality`/`watch-build` job: the tag's tree cannot change,
#   so no re-run turns it green (a macOS runner or CocoaPods hiccup is the
#   exception — re-run the failed jobs once before concluding). Otherwise
#   fix on main and let the next release-please PR carry it —
#   that version's tag is what gets verified and published. The red one stays
#   a tagged Release with no npm version, which every later push re-reports
#   until the next release moves the manifest past it.
# - Refreshing a stale release PR (e.g. after a dropped push event — the
#   2026-08-06 Actions outage left the PR stale with no way to refresh it but
#   another push): dispatch this workflow. Job 1 refreshes the PR; job 2 sees
#   the manifest version already on npm and skips green.
# - HAZARD: merge release-adjacent PRs ONE AT A TIME and let job 1 finish in
#   between. On 2026-09-18 two merges eight seconds apart had the second job 1
#   bump the version from a fresh commit list but write js/package.json from
#   a tree that predated the first merge — the release commit (0663c60)
#   quietly reverted a peer range. The gates caught it (frozen-lockfile
#   mismatch), v0.9.0 became a tagged Release with no npm version, and the
#   range was restored on main for 0.9.1.
# - HAZARD: npm refuses to republish a version that was ever `npm unpublish`ed.
#   The self-heal branch below would then fail red on every push to main until
#   the next release bumps the manifest past that version.

on:
  push:
    branches: [main]
  # Deliberately NO inputs: the gate below resolves what to publish from the
  # manifest and the tag, so a dispatch can never publish a ref someone typed
  # by hand — which is the wrong-bytes failure this design exists to close.
  # The ref a dispatch RUNS ON is the one choice: main for a normal retry or
  # a release-PR refresh, the tag to finish a publish main has moved past.
  workflow_dispatch:

# `permissions` is replace-not-merge and nothing is inherited from an empty
# top level, so each job below lists everything it needs. Keeping this empty is
# what stops the OIDC publish job from also holding `contents: write`.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NEVER cancel: aborting mid-publish can leave a tag and a GitHub Release
  # with no matching version on the registry — precisely the stuck state this
  # workflow exists to end. Queue the second run instead.
  cancel-in-progress: false

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}
      commit: ${{ steps.gate.outputs.commit }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Decide whether to publish
        id: gate
        env:
          # release-please-config.json declares a `js` package with no root
          # component, so the action PATH-PREFIXES its per-release outputs: the
          # un-prefixed `release_created` from the action README's example is
          # never set here. Index syntax, not `.js--release_created`, so the
          # hyphens cannot be mis-lexed.
          #
          # Note the footgun in the un-prefixed sibling: `releases_created` is
          # ALWAYS set — to the literal string 'false' when nothing released —
          # and a non-empty string is truthy in a GitHub expression. The
          # prefixed output used here is set only on a real release, but it is
          # still compared to 'true' rather than tested for truthiness.
          RELEASED: ${{ steps.rp.outputs['js--release_created'] }}
          RELEASED_TAG: ${{ steps.rp.outputs['js--tag_name'] }}
          RELEASED_VERSION: ${{ steps.rp.outputs['js--version'] }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "${RELEASED:-}" = "true" ]; then
            VERSION="$RELEASED_VERSION"
            TAG="$RELEASED_TAG"
            echo "release-please cut ${TAG} in this run."
          else
            # Nothing released this run. Fall back to the manifest, which names
            # the version that SHOULD be on the registry — this is the branch
            # that finishes a release whose publish never happened.
            VERSION="$(jq -r '.js' .release-please-manifest.json)"
            TAG="react-watchos-v${VERSION}"
            echo "No release this run; checking whether ${VERSION} (${TAG}) reached npm."
          fi

          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

          # The tag must exist before anything is packed: publishing a version
          # nothing tagged would ship bytes no Release points at. Ask the
          # REMOTE — actions/checkout fetches depth 1 and no tags, so local git
          # knows about none of them. Keep the commit it names: release-please
          # makes lightweight tags, so the one line IS the commit; an annotated
          # tag would add a peeled `^{}` line, which is the one to take then.
          TAG_COMMIT="$(git ls-remote --tags "$REPO_URL" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { plain = $1 } END { print (peeled != "" ? peeled : plain) }')"
          if [ -z "$TAG_COMMIT" ]; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "::notice::${TAG} does not exist — nothing to publish."
            exit 0
          fi
          echo "commit=${TAG_COMMIT}" >>"$GITHUB_OUTPUT"

          # `npm view <pkg>@<version>` exits 1 with E404 when the version is
          # absent — and that is the PUBLISH path, so a bare call under `set -e`
          # would kill the step exactly where it has to continue. Tolerate the
          # exit code, then separate a real E404 from a registry/network
          # failure: an npm outage must not read as "not published yet".
          set +e
          FOUND="$(npm view "react-watchos@${VERSION}" version 2>/tmp/npm-view.err)"
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ] && [ -n "$FOUND" ]; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "::notice::react-watchos@${VERSION} is already on npm — nothing to do."
            exit 0
          fi

          if ! grep -q 'E404' /tmp/npm-view.err; then
            cat /tmp/npm-view.err >&2
            echo "::error::Could not determine whether react-watchos@${VERSION} is published."
            exit 1
          fi

          # The gates below check out THIS run's commit (they take no ref), and
          # so does the publish job. Both must be the tagged tree, or the run
          # would verify one commit and attest another. Red, not a skip: a
          # tagged Release with no npm version is broken until someone acts,
          # and the fix is one dispatch on the tag.
          if [ "$TAG_COMMIT" != "$RUN_SHA" ]; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "::error::react-watchos@${VERSION} is not on npm, but this run is on ${RUN_REF} at ${RUN_SHA}, not the tagged ${TAG_COMMIT}. Finish the release on the tag: gh workflow run release.yml --ref ${TAG}"
            exit 1
          fi

          echo "publish=true" >>"$GITHUB_OUTPUT"
          echo "::notice::react-watchos@${VERSION} is not on npm — publishing ${TAG} (${TAG_COMMIT})."

  # The gates main runs, re-run on the tagged commit. Until 2026-09 `publish`
  # depended on `release_please` alone: it re-ran five of the checks a push
  # to main runs (build, typecheck, lint, size, vitest) and RACED the rest —
  # codegen drift, the examples' single-React build, the Linux `swift build`
  # + `swift test` of the sources the tarball ships, publint/attw over the
  # packed artifact — none of which could stop a publish. ci.yml, quality.yml
  # and build.yml are called here as reusable workflows, and `publish` needs
  # all three. They check out this run's commit, which job 1 has just proved
  # to be the tag's. Only when there is something to publish: on an ordinary
  # push to main the workflows already ran on their own triggers.
  #
  # build.yml is the expensive one — three macOS jobs, ~30-40 min wall clock
  # per publish — and it is called anyway, because it is the ONLY place the
  # `#if os(watchOS)` host compiles: Package.swift drops ReactWatchHost and
  # ReactWatchWidget from the package on Linux, so ci.yml's `swift build`
  # never sees them. Without it a Swift compile break
  # in ReactWatchHost or ReactWatchWidget publishes green and surfaces in a
  # consumer's Xcode after they have installed the version. Its concurrency
  # group carries `github.workflow`, so this called copy and a
  # push-triggered run on the same ref never cancel each other.
  #
  # `permissions` is stated even though it looks redundant: a called
  # workflow's token can only be equal to or narrower than the CALLER's, and
  # this file declares `permissions: {}` at the top; ci.yml's jobs ask for
  # `contents: read`, so without this the run is rejected before any job
  # starts. The `./` form, not GitHub's `$/` self-repository form zizmor
  # wants: actionlint 1.7.12 rejects `$/` for reusable-workflow calls, and a
  # `uses:` GitHub refuses kills the whole file (see vendor-quickjs.yml).
  gates:
    needs: release_please
    if: needs.release_please.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  quality:
    needs: release_please
    if: needs.release_please.outputs.publish == 'true'
    # Same rule as `gates` above.
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml # zizmor: ignore[self-repository]

  watch-build:
    needs: release_please
    if: needs.release_please.outputs.publish == 'true'
    # Same rule as `gates` above.
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]

  publish:
    # `needs` on the three called workflows is the gate: a red or cancelled
    # battery skips this job (no status-check function in the `if`, so
    # `success()` is implied), and the RUNBOOK above says what happens next.
    needs: [release_please, gates, quality, watch-build]
    if: needs.release_please.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref`: this checks out the run's own commit, the same one the
          # three called gate workflows just verified, and job 1 only lets
          # this job run when that commit is the tag's. The step below proves
          # it again on the checkout that gets packed, because trusted
          # publishing attaches provenance automatically and the attestation
          # would faithfully attest the WRONG commit if main had drifted.
          persist-credentials: false
      - name: The checked-out commit is the tagged one
        env:
          TAG: ${{ needs.release_please.outputs.tag }}
          TAG_COMMIT: ${{ needs.release_please.outputs.commit }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TAG_COMMIT" ]; then
            echo "::error::checked out ${HEAD_SHA}, but ${TAG} names ${TAG_COMMIT} — refusing to publish."
            exit 1
          fi
          echo "${TAG} = ${HEAD_SHA}"
      # No `version` input: pnpm/action-setup reads the exact pinned version
      # from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Deliberately NO registry-url and NO NODE_AUTH_TOKEN — trusted
      # publishing needs neither; adding them would bypass/break OIDC auth.
      # No `cache:` input on purpose: a publish workflow must not restore a
      # cache another workflow could have poisoned (zizmor cache-poisoning).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"
      # Trusted publishing requires npm >= 11.5.1. Whichever npm the Node 24
      # image happens to bundle is an assumption, not a control: an image
      # refresh that ships an older npm would break OIDC auth at publish time,
      # after the tag and the Release already exist. Pin it — to an EXACT
      # version, not a range: `^11.5.1` resolved to whatever the registry
      # served on the day, so the one job that holds `id-token: write` ran a
      # publisher nobody had chosen. Bump deliberately, with a look at the
      # release notes; the OIDC floor is the reason for the pin, not its value.
      # (zizmor flags any un-lockfiled global install; that IS the point here —
      # the version we need is a control, not whatever the image ships.)
      - name: Pin npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11.19.1 # zizmor: ignore[adhoc-packages]
      - name: Install (pnpm workspace)
        run: pnpm install --frozen-lockfile
      # The core gates run HERE too, against the tagged tree, before the
      # registry is contacted — cold, in the one job that holds `id-token:
      # write`, on the exact checkout that gets packed. The wider battery ran
      # in `gates`/`quality` above. js/package.json's prepublishOnly runs the
      # same build/typecheck/lint/size chain, but only once `npm publish` is
      # already underway — i.e. after the tag and the GitHub Release exist. It
      # stays there as belt and braces; a red gate should fail on a named
      # step, not strand a version that is already tagged and Released.
      - name: Build (node target)
        working-directory: js
        run: pnpm run build:node
      - name: Typecheck (strict; src + tests)
        working-directory: js
        run: pnpm run typecheck
      - name: Lint + format (Biome)
        working-directory: js
        run: pnpm run lint
      - name: Bundle size budget (minified)
        working-directory: js
        run: pnpm run check:size
      # prepublishOnly never ran the suite at all, so a release could be cut
      # over red tests — and until now this job ran that suite WITHOUT the
      # real-engine gate ("no qjs install and no REQUIRE_QJS here"). That
      # exclusion was written when the gate meant `apt-get install quickjs`:
      # apt + network surface in the one job that holds `id-token: write`, spent
      # on Bellard's QuickJS — not even the engine this package ships. Both
      # halves of the reason are dead. The gate now BUILDS the vendored
      # quickjs-ng from the checked-out tree (js/swift/Sources/CQuickJS, the
      # sources SwiftPM also compiles for watchOS): no download, no package
      # index, nothing on PATH trusted — just `cc` and ~30 s. What the
      # exclusion left behind was the worst possible hole: the bytes that go to
      # the registry were the only bytes never proven to run in the engine we
      # ship.
      #
      # Deliberately NOT cached, unlike ci.yml's identical build: a publish
      # workflow must never restore a cache another workflow could have
      # poisoned (zizmor cache-poisoning — same reason setup-node above takes
      # no `cache:`). Cold every release; 30 s is the price of trust.
      - name: Build the vendored quickjs-ng (cold — a publish job caches nothing)
        run: echo "QJS_BIN=$(tools/vendored-qjs/build.sh)" >> "$GITHUB_ENV"
      - name: Test (vitest + the vendored engine)
        working-directory: js
        # REQUIRE_QJS turns the local-dev "no C compiler -> skip" guard into a
        # loud failure: the step above just built the engine, so a skip here
        # would mean the engine gate silently stopped running on the ONE path
        # that publishes. QJS_BIN points the suite at that build.
        env:
          REQUIRE_QJS: "1"
        run: pnpm run test
      # Scan the EXACT artifact that ships: pack the tarball, extract it and
      # run gitleaks over the contents. The repo-history scan lives in
      # security.yml; this one guards the last mile.
      - name: Secret-scan the tarball
        working-directory: js
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # npm refuses a nonexistent --pack-destination (found on the first
          # real run of this workflow) — create it before packing.
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack >/dev/null
          mkdir -p /tmp/pack/x && tar -xzf /tmp/pack/react-watchos-*.tgz -C /tmp/pack/x
          /tmp/gitleaks dir /tmp/pack/x --no-banner --exit-code 1
      # The suite above proves the WORKTREE matches CHECKSUMS.sha256
      # (vendor-integrity.test.ts). It says nothing about what `files`
      # actually packs, and the engine is ~52% of the unpacked payload
      # reaching consumers as SwiftPM C sources. Re-verify the manifest
      # INSIDE the extracted tarball — same artifact the gitleaks step
      # scanned, no second pack — so a publish that ships no engine, or a
      # mutated one, fails here instead of in a stranger's Xcode build.
      - name: Verify the vendored engine in the tarball
        run: |
          set -euo pipefail
          cd /tmp/pack/x/package/swift/Sources/CQuickJS
          sha256sum -c CHECKSUMS.sha256
      # No --provenance flag: OIDC trusted publishing attaches provenance
      # automatically.
      # Same script security.yml runs on every push, repeated here because this
      # is the last moment before bytes leave for npm: main can be pushed to
      # directly, so "it was verified when it landed" is not the same statement
      # as "it is verified now, in the run that publishes".
      - name: Vendored engine is the recorded upstream commit
        # The bytes are proved against the commit; a tag upstream has since
        # moved is security.yml's alarm on main, not a reason to strand this
        # release on a tag that cannot change (a red gate here is a dead
        # version).
        env:
          VERIFY_TAG_BINDING: warn
        run: sh tools/vendor-quickjs/verify-upstream.sh
      - name: Publish to npm (trusted publishing)
        working-directory: js
        run: npm publish
