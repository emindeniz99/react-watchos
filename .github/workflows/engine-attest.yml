name: engine attest

# A required check that fails while the engine's tag→commit binding is
# unattested.
#
# The vendored engine executes every signed OTA bundle. What is vendored is an
# upstream COMMIT — VERSION.md's second line, `Upstream commit:` — found by
# resolving a release tag that is a mutable pointer. The machine can prove one
# half: this job runs tools/vendor-quickjs/verify-upstream.sh, which fetches
# quickjs-ng's git objects by that SHA and compares every vendored file
# (bytes == commit), then checks that upstream's tag still names the commit.
# It cannot prove the other half: that the binding is the one upstream meant.
# The bump bot resolved the tag and downloaded the commit on one runner, and a
# runner cannot vouch for itself. So any PR touching the vendored engine stays
# red until a human resolves the tag from a machine that is not the runner
# (`git ls-remote`, the line is in the PR body, or
# `sh tools/vendor-quickjs/resolve-tag.sh <tag>`), sees the same commit, and
# adds the `engine-digest-attested` label. Bot or human authored, same rule.
#
# The label is not sticky. This file strips it on `synchronize` (any human
# push) and on `reopened`: a push to a CLOSED PR raises no event at all, so a
# label that survived the close cannot be trusted to describe the head that
# comes back. The bot strips it itself when its own push changed the engine
# tree (its PR raises no pull_request event, so this file cannot); a bot push
# that only moved the base keeps it. `pull-requests: write`
# is what the strip costs, and it grants nothing an author lacks: a same-repo
# author with write access could add the label by hand anyway, and a fork
# PR's token is read-only, so there the strip fails red and a maintainer
# re-checks and re-labels.
#
# It runs on EVERY pull request, with no paths filter, and decides for itself
# whether the engine changed. Until 2026-09 this was a pair: this file with
# `paths: js/swift/Sources/CQuickJS/**` and a twin with the complementary
# `paths-ignore`, whose same-named job always passed — GitHub's documented
# answer to a required check that would otherwise sit at "Expected — waiting
# for status" on every PR it does not apply to. The pair was not
# complementary: a paths filter fires when ANY changed file matches, so a PR
# touching the engine plus one unrelated file ran both, and `attested`
# reported twice, red and green, under the one name branch protection looks
# at. Made required, the gate could be waved through by bundling any other
# file with the engine change. One workflow, one job, one verdict — and no
# filter means it always reports, so the wedge the twin existed for is gone.
#
# It runs on `labeled`/`unlabeled` too, so adding the label re-runs the check
# and turns it green without a push. `labeled` is also what makes it report
# at all on a PR opened with GITHUB_TOKEN (release-please, the vendor bot):
# those raise no pull_request events at open time, and a human adding any
# label fires one with THEIR token — which is also why security.yml's
# vendor-upstream job never runs on the bot's PR before merge, and why this
# file runs verify-upstream.sh itself.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  attested:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # strips the label a push invalidates
      contents: read # checkout for verify-upstream.sh
    steps:
      - name: Does this PR touch the vendored engine?
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The PR's file list from the API rather than a checkout and a diff:
          # no clone, and it is the merge-base diff GitHub itself shows. The
          # names arrive as data in a shell variable, never through a template
          # expansion; an odd name can only add a matching line, never hide
          # one, so the check fails closed. `previous_filename` is included so
          # a rename OUT of the engine directory counts as a change to it.
          # A here-string, not a pipe: under `pipefail` a file list past the
          # pipe buffer makes printf die of SIGPIPE when grep exits early,
          # and the `if` would take the else branch — failing OPEN.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -q '^js/swift/Sources/CQuickJS/' <<<"$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing under js/swift/Sources/CQuickJS changed; no engine binding to attest"
          fi
      # A push to the head invalidates whatever a human checked before it. The
      # label is removed here, visibly, rather than reasoned about from the
      # timeline — and on reopen too, since a push while the PR was closed
      # left no event to strip on.
      - name: Strip the attestation this push (or reopen) invalidated
        id: strip
        if: steps.engine.outputs.changed == 'true' && (github.event.action == 'synchronize' || github.event.action == 'reopened') && contains(github.event.pull_request.labels.*.name, 'engine-digest-attested')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event.action }}
        run: |
          if gh api -X DELETE "repos/$REPO/issues/$PR/labels/engine-digest-attested"; then
            echo "stripped=true" >> "$GITHUB_OUTPUT"
            echo "removed engine-digest-attested: the head the label was added to may have changed (${EVENT})"
          else
            echo "::error::could not remove the label (a fork PR's token is read-only) — a maintainer removes and re-adds engine-digest-attested after re-checking VERSION.md at this head"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.engine.outputs.changed == 'true'
        with:
          persist-credentials: false
      # bytes == commit, and the tag still names the commit — a fetch by SHA
      # plus shasum, executing nothing from upstream. Fails on a missing
      # `Upstream commit:` line, a byte mismatch, or tag drift.
      - name: Vendored bytes are the recorded commit's, and upstream's tag still names it
        if: steps.engine.outputs.changed == 'true'
        run: sh tools/vendor-quickjs/verify-upstream.sh
      - name: The tag→commit binding needs a human's check off this runner
        if: steps.engine.outputs.changed == 'true'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          STRIPPED: ${{ steps.strip.outputs.stripped }}
        run: |
          tag=$(sed -n '1s/^# Vendored: quickjs-ng \(v[0-9][0-9.]*\).*/\1/p' js/swift/Sources/CQuickJS/VERSION.md)
          commit=$(sed -n 's/^Upstream commit: \([0-9a-f]\{40\}\).*/\1/p' js/swift/Sources/CQuickJS/VERSION.md)
          # The event payload's label list predates a strip made in this run,
          # so a stripped label is not an attestation.
          if [ "$STRIPPED" != true ]; then
            case ",$LABELS," in
              *,engine-digest-attested,*)
                echo "attested — a human confirmed $tag → $commit from a machine that is not this runner"
                exit 0
                ;;
            esac
          fi
          echo "::error::This PR changes js/swift/Sources/CQuickJS. From a machine that is not this runner, confirm that upstream tag $tag resolves to commit $commit (VERSION.md lines 1-2; the ls-remote line is in the PR body, or run \`sh tools/vendor-quickjs/resolve-tag.sh $tag\`), then add the engine-digest-attested label. A push to this PR, or a reopen, removes the label; re-check and re-add."
          exit 1
