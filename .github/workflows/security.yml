# Secret scanning — the authoritative layer (the local pre-push hook in
# .githooks/ is best-effort; this one cannot be skipped). Two independent
# scanners over the FULL git history: gitleaks (pattern + entropy) and
# trufflehog (pattern + live credential verification). The npm tarball gets
# its own scan in release.yml right before publish.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan: new detector rules catch old leaks.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # Is the vendored engine still upstream's engine? CHECKSUMS.sha256 cannot
  # answer that — it is self-referential, so regenerating it after an edit goes
  # green over the same bytes — and `engine attest` only fires on
  # `pull_request`, so a direct push to main never meets it. This compares our
  # files against quickjs-ng's own git objects at the tag VERSION.md names, on
  # every push and PR. The publish job runs the same script before npm sees the
  # tarball, so a tampered engine cannot ship even if it reached main.
  vendor-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Vendored engine matches upstream at its tag
        run: sh tools/vendor-quickjs/verify-upstream.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — the scan covers every commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # The CLI directly, not the trufflesecurity/trufflehog action: the
      # action diff-scans BASE..HEAD and hard-errors when they are equal
      # (re-runs, schedules, some pushes). We want the FULL history every
      # time — same invocation as the local pre-publish scan.
      #
      # --results=verified,unknown: fail on credentials that are LIVE or whose
      # verification errored, not on candidates the service definitively
      # rejected. Day one of codeql.yml proved why: trufflehog's Github
      # detector reads the SHA pin in `github/codeql-action/init@<40-hex>` —
      # the pin zizmor requires — as a classic 40-hex token and failed main on
      # an "unverified" commit hash. Allowlisting that SHA would re-break on
      # every codeql-action bump; scoping to liveness is structural. The
      # pattern-regardless-of-liveness axis is gitleaks' job above — this
      # split is the reason the workflow runs both scanners.
      - name: trufflehog full-history scan
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:3.90.8 \
            git file:///repo --no-update --fail --results=verified,unknown

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Workflow-security regression gate: unpinned actions, excessive
      # permissions, credential persistence, injection sinks (Datadog's
      # GitHub-Actions attack classes). Zero findings is the baseline.
      - name: zizmor
        run: |
          curl -fsSL https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          /tmp/zizmor .github/workflows/
