name: release-please

# Maintains the release PR from Conventional Commits on main. Merging the
# release PR creates the GitHub release, which triggers the npm publish
# workflow (release.yml).

on:
  push:
    branches: [main]
  # Manual refresh of the release PR — e.g. re-running after a GitHub Actions
  # incident dropped the push-triggered run (2026-08-06 outage).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
